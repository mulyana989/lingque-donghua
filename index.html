<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingQue 灵雀 · v4.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
body[data-theme="night"]{--bg:#0a1418;--panel:#101f27;--panel2:#152832;--panel3:#1a303c;--line:rgba(165,195,205,.13);--line-gold:rgba(216,167,86,.30);--ink:#e9eef0;--muted:#8aa3ac;--faint:#5d7680;--cinnabar:#e14b3c;--cinnabar2:#ff6a55;--gold:#d9a756;--gold2:#f0c87e;--jade:#5ec9a0;--azure:#6db4d8;--hover:rgba(217,167,86,.06);--shadow:0 12px 32px rgba(0,0,0,.4);--m1:#0c1a20;--m2:#0f2129;--m3:#143039;--moon:rgba(240,200,126,.85);--cloud:rgba(180,215,225,.05);--topbar:rgba(10,20,24,.72)}
body[data-theme="day"]{--bg:#f2ead9;--panel:#faf5e9;--panel2:#f3ecd9;--panel3:#ece2c9;--line:rgba(94,74,46,.15);--line-gold:rgba(166,120,52,.35);--ink:#2b241b;--muted:#7c6f5c;--faint:#a4977f;--cinnabar:#c93a2b;--cinnabar2:#e0523f;--gold:#a97b2f;--gold2:#c99a4b;--jade:#2f9a72;--azure:#3d7fa6;--hover:rgba(169,123,47,.08);--shadow:0 10px 26px rgba(90,70,40,.14);--m1:#e0d2b4;--m2:#e7dcc1;--m3:#efe5cd;--moon:rgba(200,120,40,.35);--cloud:rgba(255,255,255,.65);--topbar:rgba(242,234,217,.78)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background .45s ease,color .45s ease;overflow-x:hidden}
::selection{background:var(--cinnabar);color:#fff}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:var(--line-gold);border-radius:9px}
.disp{font-family:'ZCOOL XiaoWei',serif}.brush{font-family:'Ma Shan Zheng',cursive}.gone{display:none!important}
.on-dot{width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px rgba(61,220,132,.8);display:inline-block;margin-left:5px;vertical-align:middle}
.off-dot{width:9px;height:9px;border-radius:50%;background:#5d7680;display:inline-block;margin-left:5px;vertical-align:middle;opacity:.5}
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow-a,.glow-b{position:absolute;border-radius:50%;filter:blur(90px)}
.glow-a{width:560px;height:560px;left:-180px;top:-160px;background:radial-gradient(circle,rgba(94,201,160,.10),transparent 70%)}
.glow-b{width:640px;height:640px;right:-220px;top:22%;background:radial-gradient(circle,rgba(225,75,60,.09),transparent 70%)}
.cloud{position:absolute;width:240px;height:58px;border-radius:60px;background:var(--cloud);filter:blur(3px);animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:96px;height:96px;top:-42px;left:42px}.cloud::after{width:64px;height:64px;top:-26px;left:128px}
.c1{top:12%;animation-duration:140s}.c2{top:34%;transform:scale(1.5);animation-duration:190s;animation-delay:-70s}.c3{top:60%;transform:scale(.8);animation-duration:110s;animation-delay:-30s}
@keyframes drift{from{left:-340px}to{left:110vw}}
#mountains{position:absolute;bottom:0;left:0;width:100%;height:320px}
.ember{position:absolute;bottom:-24px;border-radius:50%;filter:blur(1px);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.85}85%{opacity:.5}100%{transform:translate(var(--sx),-110vh);opacity:0}}
#auth{position:fixed;inset:0;z-index:40;overflow-y:auto;display:grid;place-items:center;padding:30px 16px}
.auth-wrap{width:100%;max-width:440px;text-align:center}
.auth-brand{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px}
.auth-brand .seal-mark{width:56px;height:56px;font-size:24px}
.auth-brand b{font-family:'Ma Shan Zheng';font-weight:400;font-size:44px}
.auth-tag{font-family:'ZCOOL XiaoWei';color:var(--gold);letter-spacing:.2em;font-size:13px;margin-bottom:6px}
.auth-ver{font-size:11px;color:var(--faint);margin-bottom:20px}
.auth-card{background:var(--panel);border:1px solid var(--line-gold);border-radius:22px;padding:26px;box-shadow:var(--shadow);text-align:left}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:999px;padding:4px;margin-bottom:20px}
.auth-tabs button{padding:9px;border-radius:999px;font-family:'ZCOOL XiaoWei';font-size:15px;letter-spacing:.1em;color:var(--muted);transition:.2s}
.auth-tabs button.on{background:linear-gradient(180deg,var(--cinnabar2),var(--cinnabar));color:#fff;box-shadow:0 4px 14px rgba(225,75,60,.4)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.05em}
.field input,.field textarea,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-size:15px;outline:none;transition:.2s;color:var(--ink)}
.field input:focus,.field textarea:focus{border-color:var(--line-gold);box-shadow:0 0 0 3px rgba(217,167,86,.12)}
.field.bad input{border-color:var(--cinnabar)!important;box-shadow:0 0 0 3px rgba(225,75,60,.18)!important}
.field-hint{font-size:11px;color:var(--gold);margin-top:5px;min-height:14px}
.auth-err{color:var(--cinnabar2);font-size:13px;min-height:18px;margin-bottom:10px;word-break:break-word}
.auth-hint{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}
.auth-hint button{color:var(--gold);font-weight:700;text-decoration:underline}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.btn-full{width:100%;padding:13px;border-radius:999px;font-family:'ZCOOL XiaoWei';font-size:16px;letter-spacing:.08em;color:#fff;background:linear-gradient(180deg,var(--cinnabar2),var(--cinnabar));box-shadow:0 8px 20px rgba(225,75,60,.35);transition:.2s}
.btn-full:hover{transform:translateY(-1px)}.btn-full:disabled{opacity:.6;cursor:wait;transform:none}
.btn-ghost{width:100%;padding:12px;border-radius:999px;border:1px dashed var(--line-gold);color:var(--gold);margin-top:12px;font-size:14px;transition:.2s}
.btn-ghost:hover{background:var(--hover)}
.av-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s;flex:none}
.swatch.sel{border-color:var(--ink);transform:scale(1.14);box-shadow:0 0 0 2px var(--gold)}
.char-input{width:64px!important;text-align:center;font-family:'Ma Shan Zheng';font-size:22px!important}
.upl-row{display:flex;gap:8px;margin-top:8px}
.btn-upl{flex:1;padding:9px;border-radius:10px;border:1px dashed var(--line-gold);color:var(--gold);font-size:12.5px;transition:.2s}
.btn-upl:hover{background:var(--hover)}
.banner-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.banner-opt{height:46px;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:.15s}
.banner-opt.sel{border-color:var(--gold);transform:scale(1.05)}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:'Ma Shan Zheng';font-size:21px;color:#fff;user-select:none;overflow:hidden;background:radial-gradient(circle at 30% 25%,var(--a1),var(--a2));box-shadow:inset 0 -3px 8px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 22%}
.avatar.sm{width:36px;height:36px;font-size:17px}
.avatar.lg{width:96px;height:96px;font-size:44px;border:4px solid var(--panel)}
.avatar.f-gold{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--gold),0 0 18px rgba(217,167,86,.5)}
.avatar.f-jade{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--jade),0 0 14px rgba(94,201,160,.4)}
.coin-chip{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line-gold);color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.coin-chip:hover{background:var(--hover);transform:translateY(-1px)}
.coin-chip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.give-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 16px 18px}
.give-opt{border:1px solid var(--line-gold);border-radius:12px;padding:10px 2px;text-align:center;cursor:pointer;transition:.15s}
.give-opt:hover{background:var(--hover);transform:translateY(-2px)}
.give-opt b{display:block;font-size:14px;color:var(--gold)}.give-opt span{font-size:9.5px;color:var(--muted)}
.give-opt.off{opacity:.35;cursor:not-allowed}
.dev-grid{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.dev-grid .btn-edit{flex:1 1 45%}
.dev-card{margin:0 16px;padding:14px 16px;border:1px solid var(--line-gold);border-radius:14px;background:linear-gradient(90deg,rgba(217,167,86,.12),rgba(225,75,60,.08));font-size:14px;line-height:2}
.announce{margin:12px 16px 0;padding:12px 16px;border-radius:14px;border:1px solid var(--line-gold);background:linear-gradient(90deg,rgba(217,167,86,.16),rgba(225,75,60,.10));color:var(--gold2);font-size:13.5px;cursor:pointer;animation:pillIn .4s;line-height:1.6}
.announce:hover{border-color:var(--gold)}
.lvl-chip{font-size:10.5px;font-weight:700;color:var(--gold);border:1px solid var(--line-gold);padding:2px 8px;border-radius:999px}
.plogo{font-size:14px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.quote-box{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted);background:var(--panel2);line-height:1.55}
#quotePrev{margin-top:10px;position:relative}
.lightbox{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.88);display:grid;place-items:center;opacity:0;pointer-events:none;transition:.25s}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:14px;box-shadow:var(--shadow)}
.app{display:none;position:relative;z-index:2;grid-template-columns:275px minmax(0,620px) 360px;justify-content:center;min-height:100vh;max-width:1310px;margin:0 auto}
body.in-app .app{display:grid}
body.in-app #auth{display:none}
.left{border-right:1px solid var(--line)}
.left-inner{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;gap:4px}
.center{border-right:1px solid var(--line);min-width:0}
.right{padding:0 20px}
.right-inner{position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:14px 0 30px;scrollbar-width:none}
.right-inner::-webkit-scrollbar{display:none}
.logo{display:flex;align-items:center;gap:12px;padding:6px 10px 18px;cursor:pointer;user-select:none}
.seal-mark{width:46px;height:46px;flex:none;border-radius:10px;display:grid;place-items:center;background:linear-gradient(160deg,var(--cinnabar2),var(--cinnabar));color:#fff;font-family:'Ma Shan Zheng';font-size:20px;box-shadow:0 6px 18px rgba(225,75,60,.4),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.logo:hover .seal-mark{transform:rotate(-8deg) scale(1.06)}
.logo-txt b{font-family:'Ma Shan Zheng';font-weight:400;font-size:30px;line-height:1;color:var(--ink);display:block}
.logo-txt small{font-size:9.5px;letter-spacing:.12em;color:var(--gold);font-family:'ZCOOL XiaoWei'}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav-item{display:flex;align-items:center;gap:16px;padding:11px 14px;border-radius:999px;font-size:17px;color:var(--ink);transition:.18s;position:relative;text-align:left}
.nav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-item:hover{background:var(--hover);transform:translateX(3px)}
.nav-item.active{font-weight:700}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:4px;background:var(--cinnabar)}
.nav-item.devnav{color:var(--gold2)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--cinnabar);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;margin-left:-6px;box-shadow:0 0 0 3px var(--bg);transition:.3s}
.badge.gone-b{transform:scale(0);opacity:0}
.btn-post{margin:18px 6px 8px;padding:14px;border-radius:999px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(180deg,var(--cinnabar2),var(--cinnabar));letter-spacing:.08em;box-shadow:0 8px 22px rgba(225,75,60,.38),inset 0 1px 0 rgba(255,255,255,.28);transition:.2s;font-family:'ZCOOL XiaoWei'}
.btn-post:hover{transform:translateY(-2px)}.btn-post:active{transform:scale(.97)}
.me-chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:999px;transition:.18s;cursor:pointer}
.me-chip:hover{background:var(--hover)}
.me-chip .who b{font-size:14px;display:block}.me-chip .who span{font-size:12px;color:var(--muted)}
.me-chip .dots{margin-left:auto;color:var(--muted)}
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:var(--topbar);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
.topbar .t-title{font-family:'ZCOOL XiaoWei';font-size:20px;letter-spacing:.06em}
.topbar .t-sub{font-size:11px;color:var(--faint);letter-spacing:.08em}
.topbar .spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:.18s;color:var(--ink)}
.icon-btn:hover{background:var(--hover);color:var(--gold)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mini-seal{display:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tab{padding:14px;font-size:15px;color:var(--muted);position:relative;transition:.18s;font-family:'ZCOOL XiaoWei';letter-spacing:.08em}
.tab:hover{background:var(--hover)}.tab.active{color:var(--ink);font-weight:700}
.tab::after{content:'';position:absolute;left:50%;bottom:-1px;transform:translateX(-50%) scaleX(0);width:56px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--cinnabar));transition:.25s}
.tab.active::after{transform:translateX(-50%) scaleX(1)}
.composer{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.composer-body{flex:1;min-width:0}
.composer textarea{width:100%;background:none;border:none;outline:none;resize:none;font-size:19px;line-height:1.5;padding:8px 0;min-height:56px;color:var(--ink)}
.composer textarea::placeholder{color:var(--faint)}
.comp-tools{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.tool{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--gold);transition:.15s}
.tool:hover{background:var(--hover);transform:translateY(-1px)}
.tool.on{color:var(--cinnabar2)}
.tool svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.comp-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.ring-wrap{position:relative;width:24px;height:24px;display:grid;place-items:center}
.ring{width:24px;height:24px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.6}
.ring-bg{stroke:var(--line)}
.ring-fg{stroke:var(--gold);stroke-dasharray:62.83;stroke-dashoffset:62.83;stroke-linecap:round;transition:.2s}
.ring-num{position:absolute;font-size:9px;font-weight:700;color:var(--muted)}
.ring-wrap.warn .ring-fg{stroke:var(--cinnabar)}
.btn-ming{padding:9px 26px;border-radius:999px;font-family:'ZCOOL XiaoWei';font-size:16px;letter-spacing:.1em;color:#fff;background:linear-gradient(180deg,var(--cinnabar2),var(--cinnabar));box-shadow:0 5px 16px rgba(225,75,60,.35);transition:.2s}
.btn-ming:hover:not(:disabled){transform:translateY(-1px)}.btn-ming:disabled{opacity:.45;cursor:default}
.emoji-tray,.gif-tray{display:none;flex-wrap:wrap;gap:4px;padding:8px 0 2px}
.emoji-tray.open,.gif-tray.open{display:flex}
.emoji-tray button{font-size:20px;padding:5px 8px;border-radius:8px;transition:.12s}
.emoji-tray button:hover{background:var(--hover);transform:scale(1.25)}
.gif-card{width:88px;height:64px;border-radius:10px;position:relative;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:.15s}
.gif-card:hover{transform:scale(1.07);border-color:var(--gold)}
.gif-card::after{content:'GIF';position:absolute;right:4px;top:4px;font-size:8px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:1px 5px;border-radius:4px}
.gif-card .gc{position:absolute;right:4px;bottom:-14px;font-family:'Ma Shan Zheng';font-size:48px;color:rgba(255,255,255,.22)}
#compPrev{margin-top:10px;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#compPrev img{display:block;width:100%;max-height:240px;object-fit:cover}
.prev-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;z-index:2}
#pollBox{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
.poll-in{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;outline:none;color:var(--ink)}
.poll-add{align-self:flex-start;font-size:13px;color:var(--gold);padding:4px 10px;border-radius:999px;border:1px dashed var(--line-gold)}
.new-pill{margin:12px auto 0;display:flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;background:var(--panel2);border:1px solid var(--line-gold);color:var(--gold);font-size:13px;box-shadow:var(--shadow);animation:pillIn .4s cubic-bezier(.34,1.4,.64,1)}
.new-pill:hover{background:var(--panel3)}
@keyframes pillIn{from{transform:translateY(-14px);opacity:0}}
.post{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease,background .18s;cursor:pointer}
.post.in{opacity:1;transform:none}
.post:hover{background:var(--hover)}
.post.just-new{animation:flash 1.6s ease}
@keyframes flash{0%{background:rgba(217,167,86,.18)}100%{background:transparent}}
.pbody{flex:1;min-width:0}
.phead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pname{font-weight:700;font-size:15px}.pname:hover{text-decoration:underline}
.phandle{color:var(--faint);font-size:14px}
.pmore{margin-left:auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint);transition:.15s}
.pmore:hover{color:var(--gold);background:var(--hover)}
.seal{width:17px;height:17px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.ptext{margin-top:3px;font-size:15px;line-height:1.65;word-wrap:break-word;font-weight:300}
.tag{color:var(--azure);cursor:pointer}.tag:hover{text-decoration:underline}
.mention{color:var(--gold)}
.pimg{width:100%;max-height:340px;object-fit:cover;display:block;border-radius:14px;margin-top:10px;border:1px solid var(--line);cursor:zoom-in}
.scene{position:relative;height:270px;border-radius:16px;overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.scene-char{position:absolute;right:14px;bottom:-38px;font-family:'Ma Shan Zheng';font-size:170px;color:rgba(255,255,255,.14);line-height:1}
.scene-cap{position:absolute;left:12px;bottom:12px;font-size:12px;color:rgba(255,255,255,.9);background:rgba(0,0,0,.4);padding:5px 12px;border-radius:999px;backdrop-filter:blur(4px)}
.gif-badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:3px 8px;border-radius:6px;z-index:2}
.sc
